# dsh-token-usage bundle patch: adds the token-usage plugin row to the web
# profile composition. Applied as a bundle layer (dsh.bundle.patch) after
# dsh-base and dsh-web-app, so the row lands beside the other dsh.client rows.
#
# No row-level inject on purpose: the deployment's trust-fence inputs live on
# a service whose name changed across releases (`webRuntime` on dsh <= 0.2.0,
# `webStartup` on >= 0.2.1). A static inject would make the whole row fail to
# load on the wrong side of that rename — which is exactly what produced the
# HTTP 404 on /api/token-stats after the 0.2.1 upgrade. The host half instead
# resolves the fence lazily per request (see lib/index.js runtimeFence), so
# the row loads on either generation.
- insert:
    - id: token-usage
      name: dsh-token-usage
